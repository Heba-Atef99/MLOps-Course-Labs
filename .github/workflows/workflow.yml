name: CI/CD Pipeline

on:
  push:
    branches:
      - CI/CD

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        docker build -t 2019594350/churn-prediction:rowaina-730 .

    - name: Push Docker image
      run: |
        docker push 2019594350/churn-prediction:rowaina-730

    - name: Install Railway CLI
      run: curl -sSL https://railway.app/install.sh | sh

    - name: Login to Railway
      run: echo "${{ secrets.RAILWAY_API_KEY }}" | railway login --stdin

    - name: Deploy to Railway
      run: railway up --detach

    - name: Test API endpoint
      run: |
        sleep 15
        curl --fail -X GET ${{ secrets.RAILWAY_URL }}/health
