name: CI/CD Pipeline

on:
  push:
    bgit add .ranches:
      - CI/CD 

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        docker build -t 2019594350/churn-prediction:rowaina-730 .

    - name: Push Docker image
      run: |
        docker push 2019594350/churn-prediction:rowaina-730

    - name: SSH to EC2 and pull image & run container
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull 2019594350/churn-prediction:rowaina-730
          docker stop churn-container || true
          docker rm churn-container || true
          docker run -d -p 8000:8000 --name churn-container 2019594350/churn-prediction:rowaina-730

    - name: Test API endpoint
      run: |
        sleep 10
        curl -X GET http://${{ secrets.EC2_HOST }}:8000/health
